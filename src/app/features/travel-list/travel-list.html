<div class="filters-panel">
  <input
    type="text"
    #searchInput
    placeholder="Пошук туру..."
    [(ngModel)]="searchQuery"
    (ngModelChange)="onFilterChange()"> <select [(ngModel)]="selectedStatus" (ngModelChange)="onFilterChange()"> @for (status of statuses; track status) {
  <option [value]="status">{{ status }}</option>
}
</select>

  <button class="btn-reset" (click)="resetFilters(searchInput)">Очистити фільтри</button>
</div>

@if (travels$ | async; as travels) {
  <div class="travel-grid">
    @for (item of travels; track item.id) {
      <app-travel-card
        [travel]="item"
        (addToCart)="handleCardAction($event)">
      </app-travel-card>
    }
  </div>
} @else {
  <div class="loading-state">
    <h3>⏳ Завантаження подорожей...</h3>
  </div>
}
